<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Border Gradient: Orange to Deep Blue -->
    <linearGradient id="stBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="65%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Text Gradient: Warm Orange to Deep Royal Blue -->
    <linearGradient id="stTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="30%" stop-color="#F97316" />
      <stop offset="55%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="stShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Octagon Border -->
  <!-- Octagon points based on standard regular octagon -->
  <polygon 
    points="58.5,8 141.5,8 192,58.5 192,141.5 141.5,192 58.5,192 8,141.5 8,58.5" 
    fill="#0F172A" 
    stroke="url(#stBorderGrad)" 
    stroke-width="7" 
    stroke-linejoin="round"
    filter="url(#stShadow)"
  />

  <!-- Inner Octagon Thin Accent Line -->
  <polygon 
    points="62,17 138,17 183,62 183,138 138,183 62,183 17,138 17,62" 
    fill="none" 
    stroke="url(#stBorderGrad)" 
    stroke-width="1.8" 
    stroke-opacity="0.6"
    stroke-linejoin="round"
  />

  <!-- Centered Serif ST Logotype matching the uploaded emblem -->
  <text 
    x="100" 
    y="132" 
    text-anchor="middle" 
    font-family="'Playfair Display', 'Times New Roman', 'Georgia', serif" 
    font-size="94" 
    font-weight="900" 
    letter-spacing="-3"
    fill="url(#stTextGrad)"
    style="text-shadow: 0 1px 2px rgba(0,0,0,0.4);"
  >
    ST
  </text>
</svg>
